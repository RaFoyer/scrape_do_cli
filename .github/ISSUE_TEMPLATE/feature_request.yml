name: Feature request
description: Suggest an improvement or new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What use case is not supported today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: What should be added or changed?
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: Success Criteria
      description: How should we verify this is done?
      placeholder: |
        - New command/flag behavior
        - Expected output
        - Test coverage expectations
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches you considered
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Links, examples, constraints
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues for duplicates
          required: true

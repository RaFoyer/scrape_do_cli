name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps
      description: Exact commands and inputs
      placeholder: |
        1. sdo ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: sdo version
      placeholder: sdo version
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: macOS/Linux/Windows, shell, Go version
    validations:
      required: true
